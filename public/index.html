<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MalikGPT — Stream Command Dashboard</title>
<link rel="stylesheet" href="/css/dashboard.css"><script src="/socket.io/socket.io.js"></script></head>
<body><div class="wrap">
<header><h1>MalikGPT <span>Unified Chat</span></h1>
<div class="links"><button class="btn ghost" data-copy="/overlay.html">Copy chat overlay</button><button class="btn ghost" data-copy="/viewers.html">Copy viewer overlay</button><button class="btn ghost" data-copy="/dock.html">Copy chat dock</button></div></header>
<section class="panel toolbar">
<label class="switch"><input type="checkbox" id="swIcon"><i></i>Show channel icon (Twitch)</label>
<div class="iconup"><img id="iconPrev" alt="" hidden><label class="btn ghost">Upload icon<input type="file" id="iconFile" accept="image/png,image/jpeg,image/webp,image/gif" hidden></label><button class="btn ghost" id="iconDel" hidden>Remove</button></div>
<label class="switch"><input type="checkbox" id="swTikTok" checked><i></i>TikTok enabled</label>
<div class="add"><select id="addSel"></select><button class="btn primary" id="addBtn">+ Add platform</button><button class="btn" id="allBtn">Connect all</button></div>
</section>
<main><section id="cards" class="cards"></section>
<section class="panel feed"><div class="fh"><h2>Live chat</h2><div class="vc" id="vc"></div><button class="btn ghost" id="clr">Clear</button></div><div id="feed"></div></section></main>
</div><script src="/js/dashboard.js"></script></body></html>
