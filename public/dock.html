<!DOCTYPE html><html><head><meta charset="UTF-8"><title>MalikGPT Chat Dock</title><script src="/socket.io/socket.io.js"></script>
<style>*{box-sizing:border-box;margin:0}body{background:#0b0916;color:#eee;font:14px Segoe UI,sans-serif;height:100vh;display:flex;flex-direction:column}
#bar{padding:6px 8px;border-bottom:1px solid #2a2250;display:flex;gap:10px;align-items:center;flex-wrap:wrap}#bar label{font-size:12px;cursor:pointer}#v{margin-left:auto;color:#00f2fe;font-size:12px}
#f{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px}.m{display:flex;gap:6px;align-items:flex-start;line-height:1.3}.m img{width:18px;height:18px;margin-top:1px;border-radius:50%}.m b{white-space:nowrap}</style></head>
<body><div id="bar"><span id="chk"></span><span id="v"></span></div><div id="f"></div>
<script>
const s=io(),f=document.getElementById('f'),off=new Set(),icons={};let showIcon=false;
const dec=t=>String(t||'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&');
const col=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))>>>0;return`hsl(${h%360},90%,65%)`};
s.on('settings',x=>showIcon=x.showChannelIcon);
s.on('viewerCounts',v=>document.getElementById('v').textContent=Object.keys(v).length?'👁 '+Object.values(v).reduce((a,b)=>a+b,0):'');
s.on('chatMessage',m=>{
 if(!icons[m.platform]){icons[m.platform]=1;const l=document.createElement('label');l.innerHTML=`<input type=checkbox checked> ${m.platform}`;l.firstChild.onchange=e=>e.target.checked?off.delete(m.platform):off.add(m.platform);document.getElementById('chk').append(l)}
 if(off.has(m.platform))return;
 const d=document.createElement('div');d.className='m';
 const i=document.createElement('img');i.src=showIcon&&m.channelIcon?m.channelIcon:`/icons/${m.platform.replace(/[^a-z]/g,'')}.svg`;
 const b=document.createElement('b');b.style.color=col(m.username);b.textContent=dec(m.username)+':';
 const t=document.createElement('span');t.textContent=dec(m.message);d.append(i,b,t);f.append(d);
 while(f.children.length>300)f.firstChild.remove();f.scrollTop=f.scrollHeight});
</script></body></html>
